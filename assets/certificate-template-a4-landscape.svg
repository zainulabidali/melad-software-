<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2970 2100" width="297mm" height="210mm" style="background:#FFFFFF;">
  <defs>
    <!-- Premium Linear & Radial Gradients -->
    <linearGradient id="goldLinear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C5A059"/>
      <stop offset="25%" stop-color="#EED59B"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="75%" stop-color="#B8860B"/>
      <stop offset="100%" stop-color="#8A651E"/>
    </linearGradient>

    <linearGradient id="goldHBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8A651E" stop-opacity="0.2"/>
      <stop offset="20%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#FFF2CE"/>
      <stop offset="80%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#8A651E" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="navyLinear" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0A192F"/>
      <stop offset="100%" stop-color="#142642"/>
    </linearGradient>

    <radialGradient id="subtleVignette" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#FBFBF9"/>
      <stop offset="100%" stop-color="#F3F3ED"/>
    </radialGradient>

    <radialGradient id="sealGoldGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFF5D6"/>
      <stop offset="30%" stop-color="#E5BE65"/>
      <stop offset="70%" stop-color="#B8860B"/>
      <stop offset="100%" stop-color="#78550E"/>
    </radialGradient>

    <!-- Subtle Academic Security Pattern -->
    <pattern id="academicGrid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 60 M 0 0 L 60 60" fill="none" stroke="#E2D9C5" stroke-width="0.35" stroke-opacity="0.35"/>
      <circle cx="30" cy="30" r="1.5" fill="#D4AF37" fill-opacity="0.18"/>
    </pattern>

    <!-- Corner Guilloche / Academic Knot Motif -->
    <g id="cornerOrnament">
      <path d="M 0 0 L 120 0 C 60 0 0 60 0 120 Z" fill="url(#goldLinear)" fill-opacity="0.12"/>
      <path d="M 0 0 L 90 0 C 45 0 0 45 0 90 Z" fill="#0A192F" fill-opacity="0.06"/>
      <line x1="0" y1="0" x2="140" y2="0" stroke="url(#goldLinear)" stroke-width="2"/>
      <line x1="0" y1="0" x2="0" y2="140" stroke="url(#goldLinear)" stroke-width="2"/>
      <line x1="12" y1="12" x2="110" y2="12" stroke="#0A192F" stroke-width="1" stroke-opacity="0.6"/>
      <line x1="12" y1="12" x2="12" y2="110" stroke="#0A192F" stroke-width="1" stroke-opacity="0.6"/>
      <line x1="24" y1="24" x2="80" y2="24" stroke="url(#goldLinear)" stroke-width="1"/>
      <line x1="24" y1="24" x2="24" y2="80" stroke="url(#goldLinear)" stroke-width="1"/>
      <!-- Subtle geometric diamonds -->
      <polygon points="45,45 52,38 59,45 52,52" fill="url(#goldLinear)"/>
      <circle cx="45" cy="45" r="1.5" fill="#0A192F"/>
      <circle cx="59" cy="45" r="1.5" fill="#0A192F"/>
      <circle cx="52" cy="38" r="1.5" fill="#0A192F"/>
      <circle cx="52" cy="52" r="1.5" fill="#0A192F"/>
    </g>
  </defs>

  <!-- Base Paper Background -->
  <rect x="0" y="0" width="2970" height="2100" fill="url(#subtleVignette)"/>
  
  <!-- Subtle Micro Security Background Pattern -->
  <rect x="90" y="90" width="2790" height="1920" fill="url(#academicGrid)"/>

  <!-- ==================== OUTER & INNER BORDERS ==================== -->
  <!-- Outer Deep Navy Frame -->
  <rect x="75" y="75" width="2820" height="1950" fill="none" stroke="#0A192F" stroke-width="5" rx="4"/>
  
  <!-- Gold Accent Accent Inset -->
  <rect x="90" y="90" width="2790" height="1920" fill="none" stroke="url(#goldLinear)" stroke-width="2.5"/>
  
  <!-- Outer Pinstripe Frame -->
  <rect x="105" y="105" width="2760" height="1890" fill="none" stroke="#0A192F" stroke-width="0.8" stroke-dasharray="8,4" stroke-opacity="0.5"/>
  
  <!-- Inner White Field with Crisp Navy Margin -->
  <rect x="135" y="135" width="2700" height="1830" fill="#FFFFFF" fill-opacity="0.92" stroke="url(#goldLinear)" stroke-width="1.2"/>
  
  <!-- Fine Inner Inset Rule -->
  <rect x="150" y="150" width="2670" height="1800" fill="none" stroke="#0A192F" stroke-width="0.6" stroke-opacity="0.3"/>

  <!-- ==================== 4 CORNER ORNAMENTS ==================== -->
  <!-- Top Left -->
  <use href="#cornerOrnament" x="150" y="150"/>
  <!-- Top Right -->
  <use href="#cornerOrnament" transform="translate(2820, 150) scale(-1, 1)"/>
  <!-- Bottom Left -->
  <use href="#cornerOrnament" transform="translate(150, 1950) scale(1, -1)"/>
  <!-- Bottom Right -->
  <use href="#cornerOrnament" transform="translate(2820, 1950) scale(-1, -1)"/>

  <!-- ==================== HEADER DIVIDER & ACCENTS ==================== -->
  <!-- Top Decorative Crest Line -->
  <path d="M 985 410 L 1425 410 M 1545 410 L 1985 410" stroke="url(#goldHBorder)" stroke-width="1.5"/>
  <circle cx="1485" cy="410" r="4" fill="#D4AF37"/>
  <circle cx="1465" cy="410" r="2.5" fill="#0A192F"/>
  <circle cx="1505" cy="410" r="2.5" fill="#0A192F"/>

  <!-- ==================== RECIPIENT ACCENT BARS ==================== -->
  <!-- Under Student Name Divider -->
  <g transform="translate(1485, 1140)">
    <line x1="-580" y1="0" x2="580" y2="0" stroke="url(#goldHBorder)" stroke-width="2"/>
    <polygon points="0,-6 8,0 0,6 -8,0" fill="url(#goldLinear)"/>
    <circle cx="-18" cy="0" r="2.5" fill="#0A192F"/>
    <circle cx="18" cy="0" r="2.5" fill="#0A192F"/>
  </g>

  <!-- ==================== CENTRAL MEDALLION / SEAL ==================== -->
  <g id="officialMedallion" transform="translate(1485, 1690)">
    <!-- Medallion Rays Outer Backing -->
    <circle cx="0" cy="0" r="95" fill="none" stroke="url(#goldLinear)" stroke-width="1.5" stroke-dasharray="4, 3"/>
    <circle cx="0" cy="0" r="88" fill="url(#sealGoldGrad)" stroke="#8A651E" stroke-width="2"/>
    
    <!-- Inner Navy Circle -->
    <circle cx="0" cy="0" r="74" fill="#0A192F" stroke="url(#goldLinear)" stroke-width="2"/>
    <circle cx="0" cy="0" r="68" fill="none" stroke="#D4AF37" stroke-width="0.8" stroke-dasharray="3, 2"/>
    
    <!-- Star & Excellence Motif -->
    <polygon points="0,-36 9,-12 34,-12 14,3 21,27 0,13 -21,27 -14,3 -34,-12 -9,-12" fill="url(#goldLinear)"/>
    
    <text x="0" y="44" font-family="'Cinzel', 'Playfair Display', serif" font-size="11" font-weight="700" fill="#EED59B" text-anchor="middle" letter-spacing="3">OFFICIAL SEAL</text>
    <text x="0" y="56" font-family="'Inter', sans-serif" font-size="8" font-weight="600" fill="#CBD5E1" text-anchor="middle" letter-spacing="2">EXCELLENCE</text>

    <!-- Ribbon Tail Accents -->
    <path d="M -36 78 L -52 145 L -26 130 L 0 145 L -18 78 Z" fill="#0A192F" stroke="url(#goldLinear)" stroke-width="1.2"/>
    <path d="M 36 78 L 52 145 L 26 130 L 0 145 L 18 78 Z" fill="#0A192F" stroke="url(#goldLinear)" stroke-width="1.2"/>
  </g>

  <!-- ==================== DYNAMIC DATA ZONES (SVG PLACEHOLDERS) ==================== -->
  
  <!-- 1. INSTITUTION LOGO & HEADER ZONE -->
  <g id="zone-institution-header" text-anchor="middle">
    <!-- Reserved for Logo insertion by software: centered at (1485, 230) -->
    <rect id="cert-logo-placeholder" x="1440" y="180" width="90" height="90" rx="45" fill="none" stroke="url(#goldLinear)" stroke-width="1.5" stroke-dasharray="3, 2"/>
    <text id="cert-logo-text" x="1485" y="230" font-family="'Inter', sans-serif" font-size="14" fill="#94A3B8" font-weight="600">LOGO</text>
    
    <!-- Madrasa / Institution Name -->
    <text id="cert-madrasa-name" x="1485" y="325" font-family="'Cinzel', 'Playfair Display', 'Times New Roman', serif" font-size="36" font-weight="700" fill="#0A192F" letter-spacing="4">
      [MADRASA / INSTITUTION NAME]
    </text>
    
    <!-- Sub-affiliation or Tagline -->
    <text id="cert-institution-sub" x="1485" y="365" font-family="'Inter', sans-serif" font-size="14" font-weight="500" fill="#64748B" letter-spacing="3">
      DEPARTMENT OF ISLAMIC EDUCATION &amp; CULTURAL AFFAIRS
    </text>
  </g>

  <!-- 2. CERTIFICATE TITLE ZONE -->
  <g id="zone-title" text-anchor="middle">
    <text id="cert-main-title" x="1485" y="495" font-family="'Cinzel', 'Playfair Display', 'Georgia', serif" font-size="62" font-weight="800" fill="#0A192F" letter-spacing="7">
      CERTIFICATE OF ACHIEVEMENT
    </text>
    
    <text id="cert-sub-title" x="1485" y="545" font-family="'Inter', sans-serif" font-size="17" font-weight="500" fill="#8A651E" letter-spacing="4">
      PRESENTED IN RECOGNITION OF OUTSTANDING MERIT &amp; DISTINCTION
    </text>
  </g>

  <!-- 3. RECIPIENT PRESENTATION LEAD-IN -->
  <g id="zone-presentation" text-anchor="middle">
    <text id="cert-lead-in" x="1485" y="630" font-family="'Inter', sans-serif" font-size="18" font-style="italic" font-weight="400" fill="#475569" letter-spacing="1.5">
      This is proudly presented to
    </text>
  </g>

  <!-- 4. STUDENT NAME ZONE (FOCAL POINT) -->
  <g id="zone-student-name" text-anchor="middle">
    <text id="cert-student-name" x="1485" y="735" font-family="'Cinzel', 'Playfair Display', 'Georgia', serif" font-size="56" font-weight="700" fill="#0A192F" letter-spacing="3">
      [STUDENT FULL NAME]
    </text>
  </g>

  <!-- 5. ACHIEVEMENT, POSITION & EVENT DETAILS -->
  <g id="zone-achievement-details" text-anchor="middle">
    <!-- Lead-in for Position -->
    <text x="1485" y="825" font-family="'Inter', sans-serif" font-size="18" font-weight="400" fill="#475569" letter-spacing="1.2">
      for securing
    </text>

    <!-- POSITION BADGE / TEXT -->
    <g id="cert-position-container" transform="translate(1485, 895)">
      <!-- Elegant Pill Badge -->
      <rect x="-180" y="-36" width="360" height="62" rx="31" fill="#0A192F" stroke="url(#goldLinear)" stroke-width="2"/>
      <text id="cert-position-text" x="0" y="4" font-family="'Cinzel', 'Inter', serif" font-size="28" font-weight="800" fill="url(#goldLinear)" letter-spacing="6">
        FIRST POSITION
      </text>
    </g>

    <!-- Program & Event Context -->
    <text x="1485" y="1005" font-family="'Inter', sans-serif" font-size="19" font-weight="400" fill="#475569">
      in the competition of <tspan id="cert-program-name" font-weight="700" fill="#0A192F">[PROGRAM / COMPETITION NAME]</tspan>
    </text>

    <text x="1485" y="1048" font-family="'Inter', sans-serif" font-size="19" font-weight="400" fill="#475569">
      held during the prestigious <tspan id="cert-event-name" font-weight="700" fill="#0A192F">[EVENT / MEELAD FESTIVAL NAME]</tspan>
    </text>
  </g>

  <!-- 6. METADATA / DATES / CERTIFICATE ID -->
  <g id="zone-meta" font-family="'Inter', sans-serif" font-size="14" fill="#64748B" font-weight="500">
    <!-- Left: Date & Academic Year -->
    <text x="320" y="1520" letter-spacing="1">
      DATE: <tspan id="cert-date" font-weight="700" fill="#1E293B">[DD MONTH YYYY]</tspan>
    </text>
    <text x="320" y="1550" letter-spacing="1">
      ACADEMIC YEAR: <tspan id="cert-academic-year" font-weight="700" fill="#1E293B">[2026 – 2027]</tspan>
    </text>

    <!-- Right: Certificate Verification No -->
    <text x="2650" y="1520" text-anchor="end" letter-spacing="1">
      CERTIFICATE ID: <tspan id="cert-number" font-weight="700" fill="#1E293B">MLS-2026-[0000]</tspan>
    </text>
    <text x="2650" y="1550" text-anchor="end" letter-spacing="1">
      STATUS: <tspan font-weight="700" fill="#16A34A">OFFICIALLY VERIFIED</tspan>
    </text>
  </g>

  <!-- 7. SIGNATORY AREAS -->
  <g id="zone-signatories">
    <!-- Left Signatory (e.g. Principal / General Secretary) -->
    <g transform="translate(620, 1720)">
      <!-- Signature Line -->
      <line x1="-220" y1="0" x2="220" y2="0" stroke="#0A192F" stroke-width="1.5"/>
      <line x1="-120" y1="6" x2="120" y2="6" stroke="url(#goldLinear)" stroke-width="1"/>
      
      <!-- Text -->
      <text id="cert-signatory-1-name" x="0" y="35" font-family="'Inter', sans-serif" font-size="18" font-weight="700" fill="#0A192F" text-anchor="middle" letter-spacing="1">
        [AUTHORIZED SIGNATORY]
      </text>
      <text id="cert-signatory-1-title" x="0" y="60" font-family="'Inter', sans-serif" font-size="13" font-weight="500" fill="#64748B" text-anchor="middle" letter-spacing="2">
        GENERAL SECRETARY / PRINCIPAL
      </text>
    </g>

    <!-- Right Signatory (e.g. Convener / President) -->
    <g transform="translate(2350, 1720)">
      <!-- Signature Line -->
      <line x1="-220" y1="0" x2="220" y2="0" stroke="#0A192F" stroke-width="1.5"/>
      <line x1="-120" y1="6" x2="120" y2="6" stroke="url(#goldLinear)" stroke-width="1"/>
      
      <!-- Text -->
      <text id="cert-signatory-2-name" x="0" y="35" font-family="'Inter', sans-serif" font-size="18" font-weight="700" fill="#0A192F" text-anchor="middle" letter-spacing="1">
        [AUTHORIZED SIGNATORY]
      </text>
      <text id="cert-signatory-2-title" x="0" y="60" font-family="'Inter', sans-serif" font-size="13" font-weight="500" fill="#64748B" text-anchor="middle" letter-spacing="2">
        CONVENER / EVENT PRESIDENT
      </text>
    </g>
  </g>

  <!-- 8. FOOTER ZONE -->
  <g id="zone-footer" text-anchor="middle" font-family="'Inter', sans-serif">
    <line x1="600" y1="1880" x2="2370" y2="1880" stroke="#E2E8F0" stroke-width="1"/>
    
    <text id="cert-footer-institution" x="1485" y="1915" font-size="13" font-weight="600" fill="#475569" letter-spacing="2">
      [MADRASA NAME] • OFFICIAL EVENT MANAGEMENT SYSTEM
    </text>
    
    <text id="cert-footer-contact" x="1485" y="1940" font-size="11" font-weight="400" fill="#94A3B8" letter-spacing="1.5">
      Verified Institutional Document • Secure Record Generated via Meelad Management Portal
    </text>
  </g>
</svg>
